name: Update Today's Spin

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs a bit under load —
    # that's fine for this, nothing time-critical depends on it.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  # Lets you trigger a run manually from the Actions tab any time, e.g.
  # right after you start playing something, instead of waiting for the
  # next scheduled run.

permissions:
  contents: write

jobs:
  update-spin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current/recent track from Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/update-spin.js

      - name: Commit today-spin.json if it changed
        run: |
          git config user.name "eardrumspop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add today-spin.json
          git diff --staged --quiet || git commit -m "Update Today's Spin"
          git push
